name: Repository consistency check

on:
  # Every push gets the full repository check. No secrets are used. Pull
  # requests from forks are not run at all (no pull_request trigger).
  push:
  workflow_dispatch:

concurrency:
  group: repository-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted only. In the private deployment repository this job runs
    # only when started by hand, so it does not spend the private minutes.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      # Keep this job's checkout byte-compatible with Linux/Cloudflare without
      # changing the user's machine-wide Git configuration.
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate tracked files from the Git index with LF endings
        shell: cmd
        run: git checkout-index --force --all
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all repository and runtime checks
        run: npm run check
      - name: Verify Cloudflare Worker bundle with no upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve exact checkout SHA for dry-run.' }
          Set-Content -Path '.mlk-repo-checks-passed' -Value $sha -NoNewline -Encoding ascii
          $env:MLK_REPO_CHECKS_ALREADY_PASSED = '1'
          $env:WRANGLER_COMMAND = 'deploy'
          $env:WORKERS_CI = '1'
          if ($env:GITHUB_HEAD_REF) { $env:WORKERS_CI_BRANCH = $env:GITHUB_HEAD_REF } else { $env:WORKERS_CI_BRANCH = '__repo_check_dry_run__' }
          $env:WORKERS_CI_COMMIT_SHA = $sha
          Remove-Item Env:CLOUDFLARE_API_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:CLOUDFLARE_ACCOUNT_ID -ErrorAction SilentlyContinue
          try {
            npx --yes wrangler@4.160.1 deploy --dry-run --outdir .wrangler-dry-run
            if ($LASTEXITCODE -ne 0) { throw 'Wrangler dry-run bundle validation failed.' }
            if (-not (Test-Path '.wrangler-dry-run')) { throw 'Wrangler dry-run output directory was not created.' }
            $files = @(Get-ChildItem '.wrangler-dry-run' -File -Recurse)
            if ($files.Count -lt 1) { throw 'Wrangler dry-run produced no bundle files.' }
            "CLOUDFLARE_WRANGLER_DRY_RUN=PASS; VERSION=4.160.1; UPLOAD=NO; CREDENTIALS=NONE; FILES=$($files.Count)"
          } finally {
            Remove-Item '.mlk-repo-checks-passed' -Force -ErrorAction SilentlyContinue
            Remove-Item '.wrangler-dry-run' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item 'public/deploy-version.txt' -Force -ErrorAction SilentlyContinue
          }
      - name: Verify purchase intake auth in local Workers runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $port = 8789
          $token = 'purchase-intake-ci-runtime-token-1234567890'
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve exact checkout SHA for local Worker runtime.' }
          Set-Content -Path '.mlk-repo-checks-passed' -Value $sha -NoNewline -Encoding ascii
          $env:MLK_REPO_CHECKS_ALREADY_PASSED = '1'
          $env:WRANGLER_COMMAND = 'dev'
          $env:WORKERS_CI = '1'
          if ($env:GITHUB_HEAD_REF) { $env:WORKERS_CI_BRANCH = $env:GITHUB_HEAD_REF } else { $env:WORKERS_CI_BRANCH = '__repo_check_local_runtime__' }
          $env:WORKERS_CI_COMMIT_SHA = $sha
          Remove-Item Env:CLOUDFLARE_API_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:CLOUDFLARE_ACCOUNT_ID -ErrorAction SilentlyContinue
          $persist = Join-Path $env:RUNNER_TEMP ('mlk-wrangler-local-state-' + $sha.Substring(0,12))
          Remove-Item $persist -Recurse -Force -ErrorAction SilentlyContinue
          npx --yes wrangler@4.160.1 d1 migrations apply DB --local --persist-to $persist
          if ($LASTEXITCODE -ne 0) { throw 'Local D1 migration acceptance failed.' }
          $stdout = Join-Path $env:RUNNER_TEMP 'mlk-wrangler-local.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'mlk-wrangler-local.stderr.log'
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $args = @(
            '--yes','wrangler@4.160.1','dev','--local',
            '--persist-to',"$persist",
            '--port',"$port",
            '--var','OWNER_PASSWORD:ci-owner-password-not-production',
            '--var',"PURCHASE_INTAKE_TOKEN:$token"
          )
          $proc = Start-Process -FilePath 'npx.cmd' -ArgumentList $args -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              if ($proc.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -Method Get -TimeoutSec 2
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              $tail = @()
              if (Test-Path $stderr) { $tail += Get-Content $stderr -Tail 30 }
              if (Test-Path $stdout) { $tail += Get-Content $stdout -Tail 30 }
              throw ('Local Workers runtime did not become ready. ' + (($tail -join ' ') -replace '[\r\n]+',' '))
            }

            function Invoke-Status([string]$Path,[string]$Auth) {
              try {
                $headers = @{'content-type'='application/json'}
                if ($Auth) { $headers['authorization'] = $Auth }
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port$Path" -Method Post -Headers $headers -Body '{}' -TimeoutSec 5
                return [int]$r.StatusCode
              } catch {
                if ($_.Exception.Response) { return [int]$_.Exception.Response.StatusCode }
                throw
              }
            }

            $noToken = Invoke-Status '/api/food-research/intake-preview' ''
            $wrongToken = Invoke-Status '/api/food-research/intake-preview' 'Bearer wrong-token-that-is-long-enough-123456'
            $rightToken = Invoke-Status '/api/food-research/intake-preview' "Bearer $token"
            $otherApi = Invoke-Status '/api/food-research' "Bearer $token"
            if ($noToken -ne 403 -or $wrongToken -ne 403 -or $rightToken -ne 400 -or $otherApi -ne 403) {
              throw "Unexpected local Worker auth results: no=$noToken wrong=$wrongToken right=$rightToken other=$otherApi"
            }
            "PURCHASE_INTAKE_WORKER_RUNTIME=PASS; LOCAL_ONLY=YES; NO_TOKEN=403; WRONG_TOKEN=403; RIGHT_TOKEN_HANDLER=400; OTHER_OWNER_API=403; PRODUCTION_REQUESTS=0"

            $inboxEvent = @{
              schemaVersion=1; eventId='ci-inbox-onion-1'; capturedAt='2026-11-14T00:00:00Z'
              source=@{merchant='CI 구매수집기';domain='ci.example';archiveArtifactId='ci-inbox-artifact-1';contentSha256=('d' * 64)}
              product=@{
                name='양파 테스트 상품 1kg';brand='CI브랜드';pack='1kg'
                nutrition=@{basisAmount=100;basisUnit='g';energyKcal=40;sodiumMg=4;carbsG=9.3;proteinG=1.1}
              }
              quantity=@{value=1;unit='봉'}
            }
            $inboxBody = $inboxEvent | ConvertTo-Json -Depth 8 -Compress
            $serviceHeaders = @{'content-type'='application/json';'accept'='application/json';'authorization'="Bearer $token"}
            $store = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/api/food-research/intake" -Method Post -Headers $serviceHeaders -Body $inboxBody -TimeoutSec 10
            if ([int]$store.StatusCode -ne 202) { throw "Inbox first store expected 202, got $($store.StatusCode)." }
            $stored = $store.Content | ConvertFrom-Json
            if (-not $stored.ok -or $stored.writes -ne 'inbox-only' -or $stored.duplicate) { throw 'Inbox first store receipt mismatch.' }
            $duplicate = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/api/food-research/intake" -Method Post -Headers $serviceHeaders -Body $inboxBody -TimeoutSec 10
            if ([int]$duplicate.StatusCode -ne 200 -or -not (($duplicate.Content | ConvertFrom-Json).duplicate)) { throw 'Inbox duplicate replay was not idempotent.' }

            $ownerInbox = (& node scripts/ci-local-owner-cookie.mjs "http://127.0.0.1:$port" 'ci-owner-password-not-production' 'ci-inbox-onion-1' '양파').Trim()
            if ($LASTEXITCODE -ne 0 -or $ownerInbox -notmatch '^LOCAL_OWNER_INBOX=PASS;') { throw 'Synthetic local owner inbox acceptance failed.' }
            $ownerInbox
            $serviceInbox = Invoke-Status '/api/food-research/intake-inbox' "Bearer $token"
            if ($serviceInbox -ne 403) { throw "Service token unexpectedly reached owner inbox API: $serviceInbox" }
            "PURCHASE_INTAKE_INBOX_E2E=PASS; LOCAL_D1_MIGRATIONS=PASS; STORE=202; DUPLICATE=200; OWNER_VIEW=1; APPLIED_PENDING=0; SERVICE_OWNER_API=403; PRODUCTION_DB_WRITES=0"

          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Wait-Process -Id $proc.Id -Timeout 5 -ErrorAction SilentlyContinue
            Remove-Item '.mlk-repo-checks-passed' -Force -ErrorAction SilentlyContinue
            Remove-Item '.wrangler' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $persist -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item 'public/deploy-version.txt' -Force -ErrorAction SilentlyContinue
          }
      - name: Find Chrome or Edge for isolated browser regression
        # The browser fixture uses the private dataset; it exists only there.
        if: hashFiles('scripts/browser-nutrition-ui-smoke.mjs') != ''
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $chrome = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome/Edge is required for the isolated UI browser check.' }
          "CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify real browser UI with no production network or data
        # The browser fixture uses the private dataset; it exists only there.
        if: hashFiles('scripts/browser-nutrition-ui-smoke.mjs') != ''
        shell: pwsh
        run: |
          # Test-only dependency: pin current stable instead of old v24 transitive chain.
          # No install scripts, committed lock file, browser download or production bundle.
          npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@25.16.0
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install ephemeral browser test dependency.' }
          node scripts/browser-nutrition-ui-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Isolated browser UI smoke test failed.' }
